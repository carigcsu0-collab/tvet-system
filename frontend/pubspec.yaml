name: tvet_documents
description: TVET document generator
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.1
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  intl: ^0.19.0
  pdf: ^3.10.7
  printing: ^5.11.1
  file_picker: ^8.0.0
  window_manager: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/

  fonts:
    - family: Arial
      fonts:
        - asset: assets/fonts/arial.ttf
        - asset: assets/fonts/arialbd.ttf
          weight: 700
    - family: Checkmark
      fonts:
        - asset: assets/fonts/checkmark.ttf
    - family: CenturyGothic
      fonts:
        - asset: assets/fonts/century_gothic.ttf
        - asset: assets/fonts/century_gothic_bold.ttf
          weight: 700
        - asset: assets/fonts/century_gothic_italic.ttf
          style: italic
        - asset: assets/fonts/century_gothic_bolditalic.ttf
          weight: 700
          style: italic
    - family: Brush Script MT
      fonts:
        - asset: assets/fonts/brush_script_mt.ttf
    - family: Monotype Corsiva
      fonts:
        - asset: assets/fonts/monotype_corsiva.ttf
    - family: Constantia
      fonts:
        - asset: assets/fonts/constantia.ttf
        - asset: assets/fonts/constantia_bold.ttf
          weight: 700
        - asset: assets/fonts/constantia_italic.ttf
          style: italic
        - asset: assets/fonts/constantia_bolditalic.ttf
          weight: 700
          style: italic
