services:
  tvet_backend_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tvet_backend_api
    restart: unless-stopped
    ports:
      - "8001:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_DATABASE=tdms
      - DB_USERNAME=admin
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_KEY=${APP_KEY}
